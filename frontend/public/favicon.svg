<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Core Emblem Gradient -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>

    <!-- Cyan Accent Gradient -->
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow-core" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Squircle Base -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#primary-grad)" stroke-width="4" stroke-opacity="0.4" />

  <!-- Outer Orbit Ring / Radar Sweep -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#cyan-grad)" stroke-width="3" stroke-dasharray="12 16" stroke-opacity="0.6" />
  
  <!-- Outer Node Orbits -->
  <circle cx="256" cy="76" r="14" fill="#38bdf8" filter="url(#glow-core)" />
  <circle cx="436" cy="256" r="10" fill="#818cf8" />
  <circle cx="256" cy="436" r="14" fill="#d946ef" filter="url(#glow-core)" />
  <circle cx="76" cy="256" r="10" fill="#6366f1" />

  <!-- Central Hexagonal Agent Matrix Shield -->
  <path d="M256 128 L360 188 V308 L256 368 L152 308 V188 Z" 
        fill="url(#primary-grad)" 
        fill-opacity="0.15"
        stroke="url(#primary-grad)" 
        stroke-width="8" 
        stroke-linejoin="round"
        filter="url(#glow-core)" />

  <!-- Inner Tri-Agent Network Connections -->
  <path d="M256 170 L320 280 H192 Z" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linejoin="round" stroke-opacity="0.8" />

  <!-- Multi-Agent Node System -->
  <!-- Top Node -->
  <circle cx="256" cy="170" r="22" fill="#0f172a" stroke="url(#primary-grad)" stroke-width="6" />
  <circle cx="256" cy="170" r="10" fill="#38bdf8" filter="url(#glow-core)" />

  <!-- Bottom Left Node -->
  <circle cx="192" cy="280" r="22" fill="#0f172a" stroke="url(#primary-grad)" stroke-width="6" />
  <circle cx="192" cy="280" r="10" fill="#8b5cf6" filter="url(#glow-core)" />

  <!-- Bottom Right Node -->
  <circle cx="320" cy="280" r="22" fill="#0f172a" stroke="url(#primary-grad)" stroke-width="6" />
  <circle cx="320" cy="280" r="10" fill="#d946ef" filter="url(#glow-core)" />

  <!-- Center Core Pulsing Eye/Intelligence Hub -->
  <circle cx="256" cy="240" r="16" fill="url(#primary-grad)" filter="url(#glow-core)" />
  <circle cx="256" cy="240" r="6" fill="#ffffff" />

  <!-- Dynamic Pulse Lines from Center Core -->
  <line x1="256" y1="240" x2="256" y2="170" stroke="#ffffff" stroke-width="3" stroke-dasharray="4 4" stroke-opacity="0.9" />
  <line x1="256" y1="240" x2="192" y2="280" stroke="#ffffff" stroke-width="3" stroke-dasharray="4 4" stroke-opacity="0.9" />
  <line x1="256" y1="240" x2="320" y2="280" stroke="#ffffff" stroke-width="3" stroke-dasharray="4 4" stroke-opacity="0.9" />

  <!-- Upward Trend / Competitive Advantage Arrow Signal -->
  <path d="M220 340 L256 310 L292 340" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
</svg>